[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "linkcheck"
version = "1.0.0"
description = "Find broken links in Markdown docs: external URLs, local files, and anchors."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "someone-rs" }]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
]

[project.scripts]
linkcheck = "linkcheck.cli:main"

[project.urls]
Homepage = "https://github.com/someone-rs/linkcheck"

[tool.setuptools.packages.find]
include = ["linkcheck*"]
